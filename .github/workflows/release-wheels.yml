name: Build & Publish Wheels

# Publishes prebuilt binary wheels for all major platforms on every GitHub release.
# Without prebuilt wheels, pip falls back to compiling from source (requires Rust/rustup),
# which fails silently in locked-down corporate environments — exactly the target buyer.
#
# Uses maturin-action: https://github.com/PyO3/maturin-action
# Covers: Linux (manylinux x86_64 + aarch64), macOS (Intel + Apple Silicon), Windows x86_64
# Python: 3.10, 3.11, 3.12, 3.13

on:
  # A published GitHub Release is the sole automatic PyPI publication trigger.
  # Push the matching version tag first, then publish the GitHub Release.
  release:
    types: [published]
  # Manual dispatch builds and smoke-tests but never publishes to PyPI.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux wheels (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels (manylinux)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --find-interpreter
          sccache: true

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    name: macOS wheels (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: true

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    name: Windows wheels
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist --find-interpreter
          sccache: true

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  smoke:
    name: Clean-install smoke test
    runs-on: ubuntu-latest
    needs: [linux]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wheels-linux-x86_64
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install wheel in a clean venv and run it
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*cp3*manylinux*x86_64*.whl || /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/anchor --help
          /tmp/v/bin/python -c "from anchor import guard; print('ok')"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist, smoke]
    # Only an intentionally published GitHub Release may publish to PyPI.
    # workflow_dispatch runs the build and smoke-test jobs, but skips this job.
    if: github.event_name == 'release' && github.event.action == 'published'
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify release tag matches all package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          lock = tomllib.loads(Path("Cargo.lock").read_text(encoding="utf-8"))
          py_version = pyproject["project"]["version"]
          cargo_version = cargo["package"]["version"]
          core_lock = [p["version"] for p in lock["package"] if p["name"] == "anchor_core_rs"]
          init_text = Path("anchor/__init__.py").read_text(encoding="utf-8")
          readme_text = Path("README.md").read_text(encoding="utf-8")
          init_match = re.search(r'^__version__\s*=\s*["\']([^"\']+)', init_text, re.MULTILINE)
          readme_match = re.search(r'^\*\*Current release:\s*([^\s*]+)\*\*', readme_text, re.MULTILINE)
          expected_tag = f"v{py_version}"

          checks = {
              "Cargo.toml": cargo_version == py_version,
              "Cargo.lock": core_lock == [py_version],
              "anchor/__init__.py": bool(init_match and init_match.group(1) == py_version),
              "README.md": bool(readme_match and readme_match.group(1) == py_version),
              "release tag": os.environ.get("RELEASE_TAG") == expected_tag,
          }
          for name, ok in checks.items():
              print(f"{'OK' if ok else 'FAIL'}: {name}")
          if not all(checks.values()):
              raise SystemExit("Release tag and package metadata are not synchronized; refusing PyPI publication.")
          print(f"All package metadata matches {expected_tag}.")
          PY

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }} # API-token authentication; configure this secret in the pypi environment.
          skip-existing: true
