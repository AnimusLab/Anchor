name: Secret scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Run GitLeaks
        id: gitleaks
        continue-on-error: true
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            log_opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            log_opts="${{ github.event.before }}..${{ github.sha }}"
          fi
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/repo \
            --log-opts="$log_opts" \
            --no-banner \
            --redact \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json
          status=$?
          if [ -f gitleaks-report.json ]; then
            jq -r '.[] | "\(.RuleID) \(.File) \(.Commit)"' gitleaks-report.json
          fi
          exit "$status"
      - name: Upload redacted GitLeaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
      - name: Fail if leaks were found
        if: steps.gitleaks.outcome == 'failure'
        run: exit 1
