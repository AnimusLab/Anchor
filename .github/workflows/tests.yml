name: Tests

# Runs the test suite on every OS Anchor ships wheels for, and smoke-tests the
# real install path (build wheel -> fresh venv -> CLI) that end users go through.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Cargo.lock is lockfile v4 and needs cargo >= 1.78.
      - name: Update Rust toolchain
        run: rustup update stable --no-self-update

      - uses: Swatinem/rust-cache@v2

      - name: Install (editable, with test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      - name: Run tests
        run: python -m pytest -q

  install-smoke:
    name: wheel install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Rust toolchain
        run: rustup update stable --no-self-update

      - uses: Swatinem/rust-cache@v2

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release -o dist

      - name: Install into a clean venv and exercise the CLI
        shell: bash
        run: |
          python -m venv /tmp/clean-venv
          . /tmp/clean-venv/bin/activate
          pip install dist/*.whl
          pip check
          anchor --version

          work="$(mktemp -d)"
          cd "$work"
          git init -q .

          # init must never block without a TTY.
          anchor init < /dev/null

          # Clean tree -> exit 0.
          mkdir clean bad
          echo 'print("hello")' > clean/ok.py
          anchor check clean < /dev/null

          # Tree with findings -> exit 1, and --format json is pure JSON.
          printf 'import os\ndef f(u):\n    eval(u)\n    os.system("rm -rf " + u)\n' > bad/bad.py
          set +e
          anchor check bad < /dev/null > /dev/null
          rc=$?
          set -e
          test "$rc" -eq 1 || { echo "expected exit 1 on findings, got $rc"; exit 1; }

          set +e
          anchor check bad --format json < /dev/null > report.json
          rc=$?
          set -e
          test "$rc" -eq 1 || { echo "expected exit 1 with --format json, got $rc"; exit 1; }
          python -c "import json; d = json.load(open('report.json')); assert d['total_violations'] >= 1, d"
