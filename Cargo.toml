[package]
name = "anchor_core_rs"
version = "6.0.5"

edition = "2021"
authors = ["Tanishq Vaswani <tan@animuslab.dev>"]
description = "High-performance zero-copy governance kernel for AI systems"

[lib]
name = "anchor_core_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py310"] }
regex = "1.10"
tree-sitter = "0.20"
tree-sitter-python = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rayon = "1.8"
memmap2 = "0.9"
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
sha2 = "0.11"
sha2_10 = { package = "sha2", version = "0.10" }
hmac = "0.12"
hex = "0.4"
subtle = "2.5"
walkdir = "2.4"
rand_core = "0.10"
rand = "0.10"

tokio = { version = "1.35", features = ["full"] }

pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }
